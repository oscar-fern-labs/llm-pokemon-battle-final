<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Claude Sprite - Thoughtful Robot -->
    <g id="claude-sprite">
      <!-- Body -->
      <rect x="6" y="8" width="20" height="20" fill="#4a90e2" stroke="#2a5a8a" stroke-width="1"/>
      <rect x="8" y="10" width="16" height="16" fill="#5ba0f2" stroke="#3a6a9a" stroke-width="1"/>
      
      <!-- Head -->
      <rect x="10" y="2" width="12" height="12" fill="#4a90e2" stroke="#2a5a8a" stroke-width="1"/>
      <rect x="12" y="4" width="8" height="8" fill="#6bb0ff" stroke="#4a90e2" stroke-width="1"/>
      
      <!-- Eyes (reasoning circuits) -->
      <rect x="13" y="6" width="2" height="2" fill="#00ffff" class="glow"/>
      <rect x="17" y="6" width="2" height="2" fill="#00ffff" class="glow"/>
      
      <!-- Antenna -->
      <rect x="15" y="0" width="2" height="3" fill="#2a5a8a"/>
      <circle cx="16" cy="0" r="1" fill="#00ffff" class="pulse"/>
      
      <!-- Arms -->
      <rect x="2" y="12" width="6" height="4" fill="#4a90e2" stroke="#2a5a8a" stroke-width="1"/>
      <rect x="24" y="12" width="6" height="4" fill="#4a90e2" stroke="#2a5a8a" stroke-width="1"/>
    </g>

    <!-- ChatGPT Sprite - Chat Bubble Creature -->
    <g id="chatgpt-sprite">
      <!-- Main bubble body -->
      <ellipse cx="16" cy="16" rx="12" ry="10" fill="#10a37f" stroke="#0a6b56" stroke-width="1"/>
      <ellipse cx="16" cy="16" rx="10" ry="8" fill="#15b88a" stroke="#10a37f" stroke-width="1"/>
      
      <!-- Chat bubble tail -->
      <polygon points="6,22 2,26 8,24" fill="#10a37f" stroke="#0a6b56" stroke-width="1"/>
      
      <!-- Eyes -->
      <circle cx="12" cy="12" r="2" fill="#ffffff"/>
      <circle cx="20" cy="12" r="2" fill="#ffffff"/>
      <circle cx="12" cy="12" r="1" fill="#000000"/>
      <circle cx="20" cy="12" r="1" fill="#000000"/>
      
      <!-- Mouth (animated text dots) -->
      <circle cx="13" cy="18" r="1" fill="#ffffff" class="chat-dot1"/>
      <circle cx="16" cy="18" r="1" fill="#ffffff" class="chat-dot2"/>
      <circle cx="19" cy="18" r="1" fill="#ffffff" class="chat-dot3"/>
    </g>

    <!-- Gemini Sprite - Crystal Elemental -->
    <g id="gemini-sprite">
      <!-- Crystal body -->
      <polygon points="16,2 26,10 20,26 12,26 6,10" fill="#4285f4" stroke="#2851a3" stroke-width="1"/>
      <polygon points="16,4 24,10 19,24 13,24 8,10" fill="#5a95ff" stroke="#4285f4" stroke-width="1"/>
      
      <!-- Inner crystal -->
      <polygon points="16,8 20,12 16,20 12,12" fill="#70a5ff" stroke="#5a95ff" stroke-width="1"/>
      
      <!-- Sparkle effects -->
      <circle cx="10" cy="8" r="1" fill="#ffffff" class="sparkle1"/>
      <circle cx="22" cy="6" r="1" fill="#ffffff" class="sparkle2"/>
      <circle cx="8" cy="18" r="1" fill="#ffffff" class="sparkle3"/>
      <circle cx="24" cy="20" r="1" fill="#ffffff" class="sparkle4"/>
      
      <!-- Eyes -->
      <circle cx="13" cy="14" r="1.5" fill="#ffffff"/>
      <circle cx="19" cy="14" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Grok Sprite - Rebellious Hacker -->
    <g id="grok-sprite">
      <!-- Body -->
      <rect x="8" y="12" width="16" height="14" fill="#1da1f2" stroke="#1480c4" stroke-width="1"/>
      <rect x="10" y="14" width="12" height="10" fill="#2bb0ff" stroke="#1da1f2" stroke-width="1"/>
      
      <!-- Head -->
      <rect x="10" y="4" width="12" height="12" fill="#1da1f2" stroke="#1480c4" stroke-width="1"/>
      
      <!-- Sunglasses -->
      <rect x="9" y="8" width="6" height="4" fill="#000000" stroke="#333333" stroke-width="1"/>
      <rect x="17" y="8" width="6" height="4" fill="#000000" stroke="#333333" stroke-width="1"/>
      
      <!-- Smirk mouth -->
      <polygon points="14,13 18,13 19,14" fill="#ffffff"/>
      
      <!-- Hacker symbols -->
      <rect x="11" y="16" width="1" height="1" fill="#00ff00" class="code-flicker1"/>
      <rect x="13" y="18" width="1" height="1" fill="#00ff00" class="code-flicker2"/>
      <rect x="17" y="17" width="1" height="1" fill="#00ff00" class="code-flicker3"/>
      
      <!-- Mohawk hair -->
      <rect x="14" y="2" width="4" height="4" fill="#ff6600" stroke="#cc4400" stroke-width="1"/>
    </g>

    <!-- Llama Sprite - Majestic Creature -->
    <g id="llama-sprite">
      <!-- Body -->
      <ellipse cx="16" cy="18" rx="10" ry="8" fill="#deb887" stroke="#cd853f" stroke-width="1"/>
      
      <!-- Neck -->
      <ellipse cx="16" cy="10" rx="4" ry="8" fill="#deb887" stroke="#cd853f" stroke-width="1"/>
      
      <!-- Head -->
      <ellipse cx="16" cy="6" rx="5" ry="4" fill="#deb887" stroke="#cd853f" stroke-width="1"/>
      
      <!-- Ears -->
      <ellipse cx="12" cy="4" rx="1.5" ry="3" fill="#deb887" stroke="#cd853f" stroke-width="1"/>
      <ellipse cx="20" cy="4" rx="1.5" ry="3" fill="#deb887" stroke="#cd853f" stroke-width="1"/>
      
      <!-- Eyes -->
      <circle cx="14" cy="6" r="1" fill="#000000"/>
      <circle cx="18" cy="6" r="1" fill="#000000"/>
      
      <!-- Nostril -->
      <circle cx="16" cy="8" r="0.5" fill="#000000"/>
      
      <!-- Legs -->
      <rect x="10" y="24" width="3" height="6" fill="#8b4513"/>
      <rect x="15" y="24" width="3" height="6" fill="#8b4513"/>
      <rect x="20" y="24" width="3" height="6" fill="#8b4513"/>
      <rect x="25" y="24" width="3" height="6" fill="#8b4513"/>
      
      <!-- Flowing mane -->
      <path d="M12,2 Q8,4 10,8 Q6,6 8,10" fill="#f4a460" stroke="#deb887" stroke-width="1" class="mane-flow"/>
    </g>

    <!-- Kimi Sprite - Memory Brain Creature -->
    <g id="kimi-sprite">
      <!-- Brain body -->
      <path d="M8,8 Q8,4 12,4 Q16,2 20,4 Q24,4 24,8 Q26,12 24,16 Q24,20 20,22 Q16,24 12,22 Q8,20 8,16 Q6,12 8,8" 
            fill="#9b59b6" stroke="#7d3c98" stroke-width="1"/>
      
      <!-- Brain wrinkles (memory patterns) -->
      <path d="M10,8 Q14,6 18,8 Q22,10 20,12 Q16,14 12,12 Q8,10 10,8" 
            fill="#8e44ad" stroke="#7d3c98" stroke-width="1"/>
      <path d="M12,16 Q16,14 20,16 Q18,18 14,18 Q10,18 12,16" 
            fill="#8e44ad" stroke="#7d3c98" stroke-width="1"/>
      
      <!-- Neural connections -->
      <circle cx="10" cy="10" r="0.5" fill="#e74c3c" class="neural-pulse1"/>
      <circle cx="15" cy="8" r="0.5" fill="#e74c3c" class="neural-pulse2"/>
      <circle cx="20" cy="12" r="0.5" fill="#e74c3c" class="neural-pulse3"/>
      <circle cx="12" cy="16" r="0.5" fill="#e74c3c" class="neural-pulse4"/>
      
      <!-- Eyes -->
      <circle cx="13" cy="12" r="1.5" fill="#ffffff"/>
      <circle cx="19" cy="12" r="1.5" fill="#ffffff"/>
      <circle cx="13" cy="12" r="0.5" fill="#000000"/>
      <circle cx="19" cy="12" r="0.5" fill="#000000"/>
    </g>

    <!-- Mistral Sprite - Wind Elemental -->
    <g id="mistral-sprite">
      <!-- Core body -->
      <ellipse cx="16" cy="16" rx="6" ry="8" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Wind swirls -->
      <path d="M6,12 Q10,8 14,12 Q18,16 22,12 Q26,8 24,16 Q20,20 16,16 Q12,12 8,16 Q4,20 6,12" 
            fill="#7f8c8d" stroke="#34495e" stroke-width="1" class="wind-swirl"/>
      
      <!-- Inner tornado -->
      <path d="M14,10 Q16,8 18,10 Q20,12 18,14 Q16,16 14,14 Q12,12 14,10" 
            fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" class="tornado-spin"/>
      
      <!-- Eyes in the storm -->
      <circle cx="14" cy="13" r="1" fill="#e67e22"/>
      <circle cx="18" cy="13" r="1" fill="#e67e22"/>
      
      <!-- Debris particles -->
      <rect x="8" y="8" width="1" height="1" fill="#bdc3c7" class="debris1"/>
      <rect x="22" y="18" width="1" height="1" fill="#bdc3c7" class="debris2"/>
      <rect x="12" y="24" width="1" height="1" fill="#bdc3c7" class="debris3"/>
    </g>

    <!-- Qwen Sprite - Eastern Dragon -->
    <g id="qwen-sprite">
      <!-- Dragon body -->
      <ellipse cx="16" cy="18" rx="8" ry="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      
      <!-- Dragon head -->
      <ellipse cx="16" cy="10" rx="6" ry="5" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      
      <!-- Horns -->
      <polygon points="12,4 13,2 14,6" fill="#f39c12"/>
      <polygon points="18,6 19,2 20,4" fill="#f39c12"/>
      
      <!-- Eyes -->
      <circle cx="13" cy="9" r="1.5" fill="#fff700"/>
      <circle cx="19" cy="9" r="1.5" fill="#fff700"/>
      <circle cx="13" cy="9" r="0.5" fill="#000000"/>
      <circle cx="19" cy="9" r="0.5" fill="#000000"/>
      
      <!-- Nostrils -->
      <circle cx="15" cy="12" r="0.5" fill="#000000"/>
      <circle cx="17" cy="12" r="0.5" fill="#000000"/>
      
      <!-- Whiskers -->
      <line x1="8" y1="10" x2="12" y2="9" stroke="#f39c12" stroke-width="1" class="whisker-sway1"/>
      <line x1="20" y1="9" x2="24" y2="10" stroke="#f39c12" stroke-width="1" class="whisker-sway2"/>
      
      <!-- Traditional patterns -->
      <circle cx="16" cy="16" r="2" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
      <circle cx="16" cy="16" r="1" fill="#fff700" class="pattern-glow"/>
    </g>
  </defs>
</svg>
